## server main settings
{{serverEndpoints}}
sv_maxclients {{maxClients}}
set gamename rdr3
set sv_enforceGameBuild 1491

# OneSync is REQUIRED (ox_lib, rsg-samples, rsg-targetpractise declare /onesync)
set onesync on

# https://docs.fivem.net/docs/server-manual/server-commands/#sv_purelevel-level
#sets sv_pureLevel 1

# locale config
setr rsg_locale "en"
setr ox:locale en

## key license settings
sv_licenseKey "{{svLicense}}"

#set steam_webApiKey "YOUR_STEAM_API_KEY"
#set sv_enforceSteamAuth false

## database settings
set mysql_connection_string "{{dbConnectionString}}"
set mysql_slow_query_warning 300

# Native voice (rsg-voice)
setr voice_useNativeAudio true
setr voice_use3dAudio true
setr voice_useSendingRangeOnly true

# Server name/description/tags/banners are managed at https://portal.cfx.re/

# ox_lib theme
setr ox:primaryColor red
setr ox:primaryShade 8

# use target
setr UseTarget false

########################## RESOURCES ##########################
# Order matters: each tier only depends on resources started above it.

# 1. cfx defaults
ensure mapmanager
ensure spawnmanager

# 2. database and libraries
ensure oxmysql
ensure ox_lib
ensure PolyZone
ensure menu_base
ensure interact-sound
ensure xsound
ensure redm-female-fix

# 3. core framework (rsg-core also provides rsg-multijob)
ensure rsg-core
ensure rNotify
ensure rsg-inventory
ensure rsg-target
ensure rsg-menubase
ensure rsg-loading
ensure rsg-character
ensure rsg-wardrobe
ensure rsg-weather
ensure rsg-chat
ensure rsg-voice
ensure rsg-hud
ensure rsg-banking
ensure rsg-weapons
ensure rsg-doorlock
ensure rsg-lawman
ensure rsg-medic

# 4. everything else in the framework folder (already-started ones are skipped)
ensure [framework]

# 5. maps and community
ensure [mapmods]
ensure [community]

## Permissions ##
add_ace group.admin command allow # allow all commands to group.admin

###################### GOD ######################
#add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx rsgcore.god
{{addPrincipalsMaster}}

################### HEADADMIN ###################
#add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx rsgcore.headadmin

################### DEVELOPER ###################
#add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx rsgcore.developer

##################### ADMIN #####################
#add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx rsgcore.admin

##################### MOD #######################
#add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx rsgcore.mod

#################### HELPER #####################
#add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx rsgcore.helper

# Resources
add_ace resource.rsg-core command allow # Allow rsg-core to execute commands

# ACE Group Command Permissions
# Only GOD gets blanket command access. rsg-core grants each lower group
# access to exactly the commands registered for it (command.<name>).
add_ace rsgcore.god command allow

# Allow staff to join when RSGConfig.Server.Closed = true
add_ace rsgcore.mod rsgadmin.join allow

# Permission Group Inheritance Hierarchy
add_principal rsgcore.god group.admin             # GOD receives full group.admin commands
add_principal rsgcore.god rsgcore.headadmin       # GOD inherits HEADADMIN rights
add_principal rsgcore.headadmin rsgcore.developer # HEADADMIN inherits DEVELOPER rights
add_principal rsgcore.developer rsgcore.admin     # DEVELOPER inherits ADMIN rights
add_principal rsgcore.admin rsgcore.mod           # ADMIN inherits MOD rights
add_principal rsgcore.mod rsgcore.helper          # MOD inherits HELPER rights

# other permissions
add_ace resource.rsg-adminmenu command.refresh allow

# ox_lib permissions
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow
